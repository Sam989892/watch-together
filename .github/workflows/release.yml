name: Build & release installers

# Push a version tag (e.g. v0.1.0) to build installers for macOS + Windows and
# attach them to a GitHub Release. electron-updater reads that release, so users
# on an older version update automatically.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20   # fail fast instead of hanging (real hangs finish in <5m)
    steps:
      - uses: actions/checkout@v4

      # Windows Defender real-time scanning locks files mid-build and makes
      # electron-builder hang for the whole job. Turn it off on the runner.
      - name: Disable Defender real-time scanning (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true
        continue-on-error: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The desktop app bundles the client build + the agent's and server's
      # node_modules (see desktop/prepack.mjs), so install all of them.
      - name: Install dependencies
        run: |
          npm --prefix client install
          npm --prefix agent install
          npm --prefix server install
          npm --prefix desktop install

      - name: Build & publish installers
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Don't hunt for a code-signing cert — electron-builder otherwise hangs
          # on Windows CI trying to auto-discover one. Builds stay unsigned.
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          npm run prepack:res
          npx electron-builder --publish always
