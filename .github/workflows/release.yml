name: Build & release installers

# Push a version tag (e.g. v0.1.0) to build installers for macOS + Windows and
# attach them to a GitHub Release. electron-updater reads that release, so users
# on an older version update automatically.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # windows-2022, not windows-latest: electron-builder 25.x hangs building
        # the NSIS installer on the Windows Server 2025 runner image.
        os: [macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30   # fail fast instead of burning the 6-hour max on a hang
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The desktop app bundles the client build + the agent's and server's
      # node_modules (see desktop/prepack.mjs), so install all of them.
      - name: Install dependencies
        run: |
          npm --prefix client install
          npm --prefix agent install
          npm --prefix server install
          npm --prefix desktop install

      - name: Build & publish installers
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run prepack:res
          npx electron-builder --publish always
