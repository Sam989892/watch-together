# One-click deploy of the Watch Together sync server to Render (free, no card).
# In Render: New → Blueprint → pick this repo → Apply. You get a public
# wss:// URL that both people paste into "Friend's server address".
services:
  - type: web
    name: watch-together-server
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /
    # Auto-deploy so server fixes go live on push. A redeploy briefly restarts the
    # server, but rooms now survive that: a reconnecting client recreates its room
    # (see the join/rejoin handling), so an active watch party auto-recovers.
    autoDeploy: true
